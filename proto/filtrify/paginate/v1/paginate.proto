syntax = "proto3";

package filtrify.paginate.v1;

import "filtrify/ast/v1/ast.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";

enum Direction {
  DIRECTION_ASC = 0;
  DIRECTION_DESC = 1;
}

message OrderField {
  string field = 1;
  Direction direction = 2;
}

message Paging {
  int32 first = 1;
  string after = 2;
}

message ListRequest {
  string entity = 1;
  google.protobuf.FieldMask fieldmask = 2;

  filtrify.ast.v1.Expr search = 5;
  repeated OrderField order = 6;
  Paging paging = 7;
}

message QueryRequest {
  string entity = 1;
  google.protobuf.FieldMask fieldmask = 2;

  filtrify.ast.v1.Expr search = 5;
  repeated OrderField order = 6;
  Paging paging = 7;
}

message QueryResponse {
  repeated google.protobuf.Any data = 1;
  int32 total = 2;
  Page page = 3;
}

message Page {
  string first_cursor = 1;
  string last_cursor = 2;
  bool has_next = 3;
  bool has_previous = 4;
}
