syntax = "proto3";

package filtrify.paginate.v1;

import "filtrify/ast/v1/ast.proto";
import "google/protobuf/any.proto";
import "google/protobuf/field_mask.proto";

service PaginateService {
  rpc Get(GetRequest) returns (stream google.protobuf.Any);
  // rpc Query(GetRequest) returns (stream google.protobuf.Any);
}

enum Direction {
  ASC = 0;
  DESC = 1;
}

message OrderField {
  string field = 1;
  Direction direction = 2;
}

message Paging {
  int32 first = 1;
  string after = 2;
}

message GetRequest {
  string entity = 1;
  google.protobuf.FieldMask fieldmask = 2;

  filtrify.ast.v1.Expr search = 5;
  repeated OrderField order = 6;
  Paging paging = 7;
}

