syntax = "proto3";

package filtrify.paginate.v1;

import "filtrify/paginate/v1/paginate.proto";
import "google/protobuf/any.proto";

service PaginateService {
  rpc List(filtrify.paginate.v1.ListRequest) returns (stream google.protobuf.Any);
  rpc Query(filtrify.paginate.v1.QueryRequest) returns (filtrify.paginate.v1.QueryResponse);
}
