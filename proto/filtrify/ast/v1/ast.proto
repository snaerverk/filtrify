syntax = "proto3";

package filtrify.ast.v1;

message Expr {
  oneof condition {
    NotExpr not = 1;
    AndExpr and = 2;
    OrExpr or = 3;
    HasChildren has = 4;
    Comparison comp = 5;
  }
}

message Comparison {
  string field = 1;
  string operator = 2;
  Value value = 3;
}

message List {
  repeated Value values = 1;
}
message Value {
  oneof value {
    bool bool = 1;
    int64 integer = 2;
    float float = 3;
    string string = 4;
    List list = 5;
  }
}
message HasChildren {
  string entity = 1;
  Expr with = 2;
}
message IsNullExpr {
  string field = 1;
}
// message BoolExpr {
//   string field = 1;
//   bool value = 2;
// }

message AndExpr {
  repeated Expr conditions = 1;
}

message OrExpr {
  repeated Expr conditions = 1;
}

message NotExpr {
  Expr conditions = 1;
}
