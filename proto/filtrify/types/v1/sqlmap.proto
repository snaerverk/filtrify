syntax = "proto2";

package filtrify.types.v1;

import "google/protobuf/descriptor.proto";

message Table {
  required string name = 1;
  repeated ForeignKeyDefinition foreign_keys = 2;
}

extend google.protobuf.MessageOptions {
  optional Table table = 800100;
}

message Column {
  optional string fieldname = 1;
  map<string, string> type = 2;
  optional bool pk = 3;
}

extend google.protobuf.FieldOptions {
  optional Column col = 800110;
}

message ForeignKeyDefinition {
  repeated string fieldnames = 1;
  required ForeignKey to = 2;

  // OnDelete
}

message ForeignKey {
  optional string entity = 1;
  repeated string fieldnames = 2;
}
