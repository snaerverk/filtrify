version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/roderm/filtrify/pkg/generated
plugins:
  - remote: buf.build/protocolbuffers/go
    out: pkg/generated/
    opt:
      - paths=source_relative
      - Mgoogle/type/datetime.proto=google.golang.org/genproto/googleapis/type/datetime
  - remote: buf.build/grpc/go
    out: pkg/generated/
    opt:
      - paths=source_relative
      - Mgoogle/type/datetime.proto=google.golang.org/genproto/googleapis/type/datetime
