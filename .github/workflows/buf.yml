name: buf

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read
  pull-requests: write # buf-action posts a summary comment on PRs

jobs:
  buf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # breaking check compares against the base branch
      - uses: bufbuild/buf-action@v1
        with:
          # lint and format default to PRs only; run them everywhere, including
          # when called from the release workflow. Breaking runs on PRs unless
          # the "buf skip breaking" label is set.
          lint: true
          format: true
          # Pushing to the BSR happens in release.yml, on tags only.
          push: false

      - name: Check generated code is up to date
        run: |
          buf generate
          git diff --exit-code -- pkg/generated || {
            echo "::error::Generated code is out of date. Run 'buf generate' and commit the result."
            exit 1
          }
